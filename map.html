<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buying & Fairs — European Journeys</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React (UMD) + Babel for inline JSX -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root{
      --bg:#F2EEE6;
      --ink:#0E3B2E;
      --muted:#6B7A73;
      --pin:#7A0019;
      --border:#9BA8A2;
      --hover:#D8D1C4;
      --panel:#FFFFFF;
      --star:#F5C518;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; background:var(--bg); color:var(--ink); font-family:"Helvetica Neue", Inter, system-ui, Arial,sans-serif; }
    #map{ position:fixed; inset:0; z-index:1; }

    /* Header */
    .map-header{
      position:fixed; top:18px; right:18px; z-index:980;
      background:rgba(255,255,255,.95); padding:12px 14px; border-radius:10px;
      border:1px solid rgba(0,0,0,.06); box-shadow:0 10px 24px rgba(14,59,46,.08);
      backdrop-filter: blur(6px);
      max-width:420px;
    }
    .map-header h3{ margin:0; font-size:15px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; }
    .map-header p{ margin:6px 0 0; font-size:13px; color:var(--muted); }

    /* City Guide (left) */
    .legend{
      position:fixed; left:18px; top:50%; transform:translateY(-50%);
      width:320px; z-index:850; background:var(--panel);
      border:1px solid rgba(0,0,0,.06); border-radius:14px; box-shadow:0 14px 36px rgba(0,0,0,.14);
      padding:16px; max-height:80vh; overflow:auto;
    }
    .legend h4{ margin:0 0 6px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; }
    .legend .meta{ font-size:12.5px; color:var(--muted); margin-bottom:8px; }
    .group{ margin-top:14px; padding-top:12px; border-top:1px dashed rgba(0,0,0,.12); }
    .group h5{ margin:0 0 10px; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:#4e5954; }
    .legend ul{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
    .legend li{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; font-size:13.5px; line-height:1.35; }
    .legend .txt a{ color:#111; text-decoration:none; }
    .legend .txt a:hover{ color:var(--pin); }
    .note{ font-size:12px; font-style:italic; color:rgba(14,59,46,.58); margin-top:2px; }
    .stars{ display:inline-flex; gap:3px; min-width:90px; justify-content:flex-end; }
    .stars svg{ width:16px; height:16px; }
    .stars path{ fill:var(--star); }

    /* Timeline (right) */
    .timeline{ position:fixed; right:18px; top:50%; transform:translateY(-50%); height:78vh; width:120px; z-index:820; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; align-items:center; }
    .timeline .line{ position:absolute; left:50%; transform:translateX(-50%); width:1px; height:100%; background:rgba(0,0,0,.08); }
    .timeline .year{ font-size:52px; letter-spacing:.05em; font-weight:300; color:rgba(0,0,0,.08); transition: color .25s, transform .25s; user-select:none; }
    .timeline .year.active{ color:rgba(0,0,0,.20); transform:scale(1.06); }

    /* Leaflet look */
    .leaflet-tile{ filter: grayscale(100%) contrast(1.02) brightness(1.06) sepia(.08); }
    .leaflet-labels-pane{ opacity:.82; }
    .leaflet-tooltip{ background:rgba(255,255,255,.92); border:1px solid rgba(0,0,0,.06); color:var(--ink); border-radius:8px; box-shadow:0 8px 18px rgba(0,0,0,.08); }

    /* Country hover */
    .hovered-country{ fill:var(--hover)!important; fill-opacity:.26!important; stroke:#333!important; stroke-width:1.9!important; filter: drop-shadow(0 2px 6px rgba(0,0,0,.18)); transform: scale(1.02); transform-origin:center; transition: transform .18s ease, fill-opacity .18s ease, stroke-width .18s ease; }

    /* Popup / Gallery */
    .leaflet-popup-content{ max-width:820px; margin:8px 12px; color:var(--ink); }
    .city-label{ font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin:0; font-size:15px; }
    .meta-line{ display:flex; gap:14px; font-size:12.5px; color:var(--muted); margin:6px 0 10px; flex-wrap:wrap; }
    .gallery{ position:relative; width:100%; max-width:720px; height:420px; border-radius:14px; overflow:hidden; background:#000; box-shadow:0 14px 36px rgba(0,0,0,.14); perspective:800px; }
    .gallery .frame{ width:100%; height:100%; transform-style:preserve-3d; transition: transform .12s ease-out; }
    .gallery img{ width:100%; height:100%; object-fit:cover; display:block; user-select:none; -webkit-user-drag:none; animation:ken 14s ease-in-out infinite alternate; }
    @keyframes ken{ 0%{ transform: scale(1) translate3d(0,0,0);} 100%{ transform: scale(1.08) translate3d(2%,-2%,0);} }
    .nav-btn{ position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:999px; border:1px solid rgba(255,255,255,.4); background:rgba(0,0,0,.25); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .nav-prev{ left:12px; } .nav-next{ right:12px; }
    .desc{ margin-top:12px; font-size:13.8px; color:var(--muted); line-height:1.55; }
    .info-row{ display:flex; gap:22px; margin:12px 0 16px; flex-wrap:wrap; }
    .info-item{ display:flex; flex-direction:column; min-width:220px; }
    .info-item .icons{ display:flex; gap:6px; align-items:center; }
    .info-item .label{ font-weight:800; letter-spacing:.06em; margin-top:4px; }
    .info-item .sub{ color:var(--muted); font-size:12.5px; margin-top:2px; }
    .collab-head{ margin-top:12px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#5e6a64; font-weight:800; }
    .logo-row{ margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; }
    .logo-row img,.logo-ph{ width:100px; height:44px; object-fit:contain; background:#fff; border:1px solid #E3DED5; border-radius:8px; box-shadow:0 6px 14px rgba(0,0,0,.06); }
    .logo-ph{ display:flex; align-items:center; justify-content:center; color:#B6B0A4; font-size:11px; letter-spacing:.06em; }

    /* Route & plane */
    .route{ stroke:#111; stroke-opacity:.45; stroke-width:2; stroke-dasharray:6 6; }
    .plane{ filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }

    /* React Lanyard mount (right) */
    #lanyard-root{ position:fixed; right:18px; top:18px; z-index:1200; width:240px; pointer-events:none; }
    .lanyard-wrap{ position:relative; width:240px; height:360px; margin:0 auto; pointer-events:auto; }
    .lanyard-strap{ position:absolute; left:calc(50% - 8px); top:-40px; width:16px; height:140px; background:#000; border-radius:10px; box-shadow:0 6px 16px rgba(0,0,0,.45); }
    .lanyard-card{
      position:absolute; left:50%; top:60px; transform:translateX(-50%);
      width:220px; height:270px; background:#fff; border-radius:14px;
      border:1px solid rgba(0,0,0,.08); box-shadow:0 14px 32px rgba(0,0,0,.18);
      display:flex; flex-direction:column; align-items:center; padding:12px; gap:10px;
      cursor:grab; user-select:none; will-change: transform;
      transition: box-shadow .2s ease;
    }
    .lanyard-card:active{ cursor:grabbing; box-shadow:0 18px 44px rgba(0,0,0,.25); }
    .lanyard-title{ font-weight:800; letter-spacing:.1em; text-transform:uppercase; font-size:12px; color:var(--ink); text-align:center; }
    .lanyard-sub{ font-size:12px; color:var(--muted); text-align:center; }
    .lanyard-qr{ width:96px; height:96px; border-radius:10px; border:1px solid var(--border); overflow:hidden; background:#fff; display:flex; align-items:center; justify-content:center; }
    .lanyard-qr img{ width:100%; height:100%; object-fit:cover; display:block; }
    .lanyard-badges{ display:flex; gap:8px; align-items:center; justify-content:center; }
    .react-badge{ font-size:12px; border-radius:8px; padding:6px 8px; background:linear-gradient(180deg,#edf6ff,#e6f0ff); border:1px solid #cfe6ff; color:#0b4076; font-weight:700; }
    @media (max-width:1100px){ .legend,.timeline{ display:none; } }
  </style>
</head>
<body>

<div id="map" role="application" aria-label="Interactive map of European trade fair visits"></div>

<div class="map-header">
  <h3>Buying & Fairs — European Journeys</h3>
  <p>Drag to move. Scroll to zoom. Click pins to view the gallery.</p>
</div>

<!-- City Guide -->
<aside class="legend" id="legend">
  <h4>City Guide</h4>
  <div class="meta" id="legend-meta">Wähle einen Messestandort.</div>
  <div class="group"><h5>Restaurants</h5><ul id="legend-food"><li class="note">Noch keine Einträge</li></ul></div>
  <div class="group"><h5>Hotels</h5><ul id="legend-hotels"><li class="note">Noch keine Einträge</li></ul></div>
  <div class="group"><h5>Spots & Experiences</h5><ul id="legend-spots"><li class="note">Noch keine Einträge</li></ul></div>
</aside>

<!-- Timeline -->
<div class="timeline" id="timeline" aria-hidden="true">
  <div class="line"></div>
  <div class="year" data-y="2018">2018</div>
  <div class="year" data-y="2019">2019</div>
  <div class="year" data-y="2020">2020</div>
  <div class="year" data-y="2021">2021</div>
  <div class="year" data-y="2022">2022</div>
  <div class="year" data-y="2023">2023</div>
  <div class="year" data-y="2024">2024</div>
</div>

<!-- React Lanyard mount -->
<div id="lanyard-root"></div>

<script>
  const css=(v)=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  /* Map init */
  const map=L.map('map',{ center:[50,10], zoom:4, minZoom:3, maxZoom:12, zoomControl:true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{ attribution:'&copy; OpenStreetMap &copy; CARTO' }).addTo(map);
  map.createPane('labels'); map.getPane('labels').classList.add('leaflet-labels-pane');
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{ pane:'labels' }).addTo(map);

  /* Countries hover */
  fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
    .then(r=>r.json()).then(geo=>{
      const baseStyle={ color:css('--border'), weight:.9, opacity:.9, fillColor:'#000', fillOpacity:.02, className:'country' };
      L.geoJSON(geo,{
        style:()=>baseStyle,
        onEachFeature:(f,lyr)=>{
          const b=lyr.getBounds();
          // roughly Europe
          if(b && (b.getSouth()>30 && b.getNorth()<72 && b.getWest()>-25 && b.getEast()<40)){
            lyr.on('mouseover',()=>{ const p=lyr.getElement(); if(p){ p.classList.add('hovered-country'); } lyr.bringToFront(); });
            lyr.on('mouseout', ()=>{ const p=lyr.getElement(); if(p){ p.classList.remove('hovered-country'); } });
          } else lyr.options.interactive=false;
        }
      }).addTo(map);
    });

  /* Helpers */
  const P=(name,note,link,rating)=>({name,note,link,rating});
  function stars(n=4.5){
    const full=Math.floor(n), half=(n-full)>=0.5?1:0, empty=5-full-half;
    const star=()=>`<svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
    const halfStar=half?`<svg viewBox="0 0 24 24"><defs><linearGradient id="half"><stop offset="50%" stop-color="${css('--star')}"/><stop offset="50%" stop-color="#d7d2c7"/></linearGradient></defs><path fill="url(#half)" d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`:'';
    return `<span class="stars">${Array(full).fill(0).map(star).join('')}${halfStar}${Array(empty).fill(0).map(star).join('')}</span>`;
  }

  /* Daten (Beispiele – ergänze beliebig) */
  const points = [
    { id:"mfs_2024", title:"Munich Fabric Start", date:"09.2024", year:"2024", city:"München", country:"Germany", lat:48.1351, lng:11.5820,
      address:"MOC, Lilienthalallee 40, 80939 München, Germany", airport:"MUC — Munich Airport, 28 km",
      photos:["https://picsum.photos/seed/mfs1/1600/1100","https://picsum.photos/seed/mfs2/1600/1100"], description:"Textilien, Zutaten und Technologien …", logos:["/logos/bervic.svg","/logos/calpier.svg"],
      guide:{ food:[P("Tantris","(Ikone)","https://tantris.de",4.8)], hotels:[P("Andaz","(Designhotel)","https://www.hyatt.com",4.6)], spots:[P("Pinakothek","(Design)","https://www.pinakothek.de",4.7)] } },
    { id:"pitti_2023", title:"Pitti Uomo", date:"06.2023", year:"2023", city:"Florenz", country:"Italy", lat:43.7696, lng:11.2558,
      address:"Fortezza da Basso, Firenze", airport:"FLR — 6 km",
      photos:["https://picsum.photos/seed/pitti23a/1600/1100","https://picsum.photos/seed/pitti23b/1600/1100"], description:"Europäische Menswear-Ikone …", logos:["/logos/armor-lux.svg"], guide:{ food:[P("Trattoria Mario","(Trad.)","#",4.6)], hotels:[P("Hotel Glance","(Nahe Messe)","#",4.4)], spots:[P("Uffizien","(Kunst)","https://www.uffizi.it",4.8)] } },
    { id:"ciff_cph", title:"CIFF — Copenhagen Int. Fashion Fair", date:"08.2020", year:"2020", city:"Kopenhagen", country:"Denmark", lat:55.632, lng:12.578,
      address:"Bella Center, København", airport:"CPH — 6 km",
      photos:["https://picsum.photos/seed/ciff/1600/1100"], description:"Skandinavisches Design, Nachhaltigkeit …", logos:["/logos/bervic.svg"], guide:{ food:[P("Fiskebar","(Seafood)","https://fiskebaren.dk",4.6)], hotels:[P("AC Bella Sky","(Neben Messe)","https://www.marriott.com",4.3)], spots:[P("Louisiana Museum","(Kunst)","https://louisiana.dk",4.8)] } },
    /* → Füge deine restlichen Messen hier in identischem Format ein */
  ];

  /* Legend update */
  function updateLegend(pt){
    const meta=document.getElementById('legend-meta');
    const food=document.getElementById('legend-food');
    const hotels=document.getElementById('legend-hotels');
    const spots=document.getElementById('legend-spots');
    meta.textContent=`${pt.city}, ${pt.country} — ${pt.title} (${pt.date})`;

    function fill(el, arr){
      el.innerHTML='';
      if(!arr||!arr.length){ el.innerHTML='<li class="note">Noch keine Einträge</li>'; return; }
      arr.forEach(x=>{
        const li=document.createElement('li');
        li.innerHTML = `
          <div class="txt">
            ${x.link?`<a href="${x.link}" target="_blank" rel="noopener">${x.name}</a>`:`<strong>${x.name}</strong>`}
            ${x.note?`<div class="note">${x.note}</div>`:''}
          </div>
          ${x.rating?stars(x.rating):''}
        `;
        el.appendChild(li);
      });
    }
    fill(food, pt.guide?.food);
    fill(hotels, pt.guide?.hotels);
    fill(spots, pt.guide?.spots);
  }

  /* Timeline */
  function highlightYear(y){ document.querySelectorAll('.timeline .year').forEach(el=>el.classList.toggle('active', el.dataset.y===String(y))); }

  /* Pins + routes */
  function pinSVG(size=22,color=css('--pin')){
    return `<svg width="${size}" height="${size*1.25}" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 6.5 12.75 7.63 14.0a.5.5 0 0 0 .74 0C13.5 20.75 20 13.25 20 8c0-4.42-3.58-8-8-8z" fill="${color}"/><circle cx="12" cy="8" r="3.2" fill="#fff" opacity=".9"/></svg>`;
  }
  function createPinIcon(){ return L.divIcon({ className:'pin', html:pinSVG(22), iconSize:[22,28], iconAnchor:[11,24], popupAnchor:[0,-22] }); }

  const routeLayer = L.layerGroup().addTo(map);
  const HAMBURG = [53.5511, 9.9937];
  let lastPoint = null;

  function drawSegment(from, to){
    L.polyline([from, to], { color:'#0E3B2E', weight:1.6, opacity:0.6, dashArray:'6,8' }).addTo(routeLayer);
    const midLat = (from[0]+to[0])/2, midLng = (from[1]+to[1])/2;
    const angle = Math.atan2(to[1]-from[1], to[0]-from[0]) * 180 / Math.PI;
    const planeIcon = L.divIcon({ className:'flight-icon', html:`<div style="transform: rotate(${angle+90}deg); font-size:14px;">✈</div>`, iconSize:[24,24], iconAnchor:[12,12] });
    L.marker([midLat, midLng], { icon: planeIcon, interactive:false }).addTo(routeLayer);
  }

  function popupHTML(pt){
    const meta = `<div class="meta-line"><span>${pt.city}, ${pt.country}</span><span>${pt.date}</span></div>`;
    const first = (pt.photos && pt.photos.length) ? pt.photos[0] : 'https://picsum.photos/seed/cover/1600/1100';
    const logos = (pt.logos && pt.logos.length) ? pt.logos.map(l=>`<img src="${l}" alt="logo">`).join('') : `<div class="logo-ph">LOGO</div><div class="logo-ph">LOGO</div>`;
    return `
      <h3 class="city-label">${pt.title}</h3>
      ${meta}
      <div class="gallery" id="gallery-${pt.id}">
        <div class="frame"><img src="${first}" alt="${pt.city}"></div>
        ${pt.photos.length>1? `<button class="nav-btn nav-prev" aria-label="Previous">‹</button><button class="nav-btn nav-next" aria-label="Next">›</button>` : ''}
      </div>
      <div class="desc">${pt.description}</div>
      <div class="info-row">
        <div class="info-item">
          <div class="icons"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="#111" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5z"/></svg></div>
          <div class="label">Location</div><div class="sub">${pt.address}</div>
        </div>
        <div class="info-item">
          <div class="icons"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="#111" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9L2 14v2l8-2.5V19l-2 1.5V22l3.5-1L15 22v-1.5L13 19v-5.5l8 2.5z"/></svg></div>
          <div class="label">Nearest Airport</div><div class="sub">${pt.airport}</div>
        </div>
      </div>
      <div class="collab-head">Collaborations / Buying Companies</div>
      <div class="logo-row">${logos}</div>
      <a class="desc" href="/work/buying-and-fairs/${pt.id}" target="_blank" rel="noopener">Mehr zum Besuch →</a>
    `;
  }

  const galleryIndex = new Map();
  function bindGalleryHandlers(container, photos, id){
    const frame=container.querySelector('.gallery .frame');
    const img  =container.querySelector('.gallery img');
    const prev =container.querySelector('.nav-prev');
    const next =container.querySelector('.nav-next');
    const arr=(photos||[]);
    if(!galleryIndex.has(id)) galleryIndex.set(id,0);
    function render(){ if(!arr.length) return; const i=galleryIndex.get(id)%arr.length; img.src=arr[i]; img.style.animation='none'; void img.offsetWidth; img.style.animation='ken 14s ease-in-out infinite alternate'; }
    function go(d){ if(!arr.length) return; let i=galleryIndex.get(id); i=(i+d+arr.length)%arr.length; galleryIndex.set(id,i); render(); }
    prev && prev.addEventListener('click',e=>{ e.stopPropagation(); go(-1); });
    next && next.addEventListener('click',e=>{ e.stopPropagation(); go(1); });
    const box=container.querySelector('.gallery');
    box && box.addEventListener('mousemove',(e)=>{ const r=box.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; const rx=(.5-y)*6, ry=(x-.5)*6; frame.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`; });
    box && box.addEventListener('mouseleave',()=>{ frame.style.transform='rotateX(0) rotateY(0)'; });
    let startX=null; box && box.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; }, {passive:true});
    box && box.addEventListener('touchend',   e=>{ if(startX===null) return; const dx=e.changedTouches[0].clientX-startX; if(Math.abs(dx)>40) go(dx<0?1:-1); startX=null; });
    render();
  }

  /* Create markers */
  points.forEach(pt=>{
    const marker = L.marker([pt.lat, pt.lng], { icon:createPinIcon() }).addTo(map);
    marker.bindTooltip(pt.city, { direction:'top', offset:[0,-12], className:'custom-tooltip' });
    marker.on('click', ()=> {
      const popup = L.popup({ maxWidth:820, className:'custom-popup' }).setLatLng([pt.lat, pt.lng]).setContent(popupHTML(pt)).openOn(map);
      setTimeout(()=> {
        const galleryEl = document.getElementById(`gallery-${pt.id}`);
        if(galleryEl) bindGalleryHandlers(galleryEl, pt.photos, pt.id);
      }, 60);
      updateLegend(pt);
      highlightYear(pt.year);
      const from = window._lastPoint || [53.5511, 9.9937]; // Hamburg start
      drawSegment(from, [pt.lat, pt.lng]);
      window._lastPoint = [pt.lat, pt.lng];
      // Update React Lanyard
      if(window.setLanyard) window.setLanyard(`${pt.title}`, `${pt.city} • ${pt.date}`);
    });
  });

  /* Fit bounds */
  const latlngs = points.map(p=>[p.lat,p.lng]);
  if(latlngs.length){ map.fitBounds(L.latLngBounds(latlngs).pad(.22)); }

  /* ESC closes popup */
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') map.closePopup(); });
</script>

<!-- React Lanyard Component (JSX) -->
<script type="text/babel">
  const {useRef, useEffect, useState} = React;

  function Lanyard(){
    // public setters to update from Leaflet clicks
    const [title, setTitle] = useState('Buying & Fairs — Pass');
    const [sub, setSub] = useState('Hamburg • Europe');
    const [qr, setQr] = useState(null);

    // expose to window
    useEffect(()=>{ window.setLanyard = (t,s)=>{ setTitle(t||'Buying & Fairs — Pass'); setSub(s||'Hamburg • Europe'); }; },[]);

    // random spotify QR on mount
    useEffect(()=>{
      const tracks = ['3n3Ppam7vgaVa1iaRUc9Lp','7ouMYWpwJ422jRcDASZB7P','1dGr1c8CrMLDpV6mPbImSI','2TakcwOaAZWiXQijPHIx7B'];
      const id = tracks[Math.floor(Math.random()*tracks.length)];
      const url = `https://open.spotify.com/track/${id}`;
      const q = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
      setQr({img:q, url});
    },[]);

    // physics (springy drag/drop)
    const wrapRef = useRef(null);
    const cardRef = useRef(null);
    const animRef = useRef({ x:0, y:0, vx:0, vy:0, tx:0, ty:0, dragging:false });
    useEffect(()=>{
      const el = cardRef.current, root = wrapRef.current;
      if(!el || !root) return;
      const cfg = { k:0.015, damp:0.08, tilt:0.12, range:{x:[-40,40], y:[-10,40]} };
      function clamp(v,[a,b]){ return Math.max(a, Math.min(b, v)); }
      function render(){
        const s = animRef.current;
        const ax = (s.tx - s.x) * cfg.k;
        const ay = (s.ty - s.y) * cfg.k;
        s.vx = (s.vx + ax) * (1 - cfg.damp);
        s.vy = (s.vy + ay) * (1 - cfg.damp);
        s.x += s.vx; s.y += s.vy;
        const ang = Math.atan2(s.x, 120) * (180/Math.PI) * cfg.tilt;
        el.style.transform = `translateX(-50%) translate(${s.x}px, ${s.y}px) rotate(${ang}deg)`;
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);

      function onMove(e){
        if(animRef.current.dragging) return;
        const r = root.getBoundingClientRect();
        const x = clamp(e.clientX - (r.left + r.width/2), cfg.range.x);
        const y = clamp(e.clientY - (r.top + 60 + 135), cfg.range.y);
        animRef.current.tx = x; animRef.current.ty = y;
      }
      window.addEventListener('mousemove', onMove);

      // drag
      let offX=0, offY=0;
      function down(e){
        animRef.current.dragging = true;
        const rect = el.getBoundingClientRect();
        offX = e.clientX - rect.left - rect.width/2;
        offY = e.clientY - rect.top  - rect.height/2;
        e.preventDefault();
      }
      function move(e){
        if(!animRef.current.dragging) return;
        const r = root.getBoundingClientRect();
        animRef.current.tx = clamp(e.clientX - (r.left + r.width/2) - offX, cfg.range.x);
        animRef.current.ty = clamp(e.clientY - (r.top + 60 + 135) - offY, cfg.range.y);
      }
      function up(){ animRef.current.dragging = false; }
      el.addEventListener('mousedown', down);
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);

      return ()=>{ window.removeEventListener('mousemove', onMove); window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); el.removeEventListener('mousedown', down); };
    },[]);

    return (
      <div className="lanyard-wrap" ref={wrapRef}>
        <div className="lanyard-strap" aria-hidden="true"></div>
        <div className="lanyard-card" ref={cardRef} role="group" aria-label="Badge">
          <div style={{display:'flex', gap:8, alignItems:'center', justifyContent:'space-between', width:'100%'}}>
            <div style={{width:120}}>
              <div className="lanyard-title">{title}</div>
              <div className="lanyard-sub">{sub}</div>
            </div>
            <div className="lanyard-qr" title="QR to random Spotify track" onClick={()=> qr && window.open(qr.url,'_blank')} style={{cursor: qr?'pointer':'default'}}>
              {qr ? <img src={qr.img} alt="QR" /> : null}
            </div>
          </div>
          <div style={{flex:1, display:'flex', alignItems:'center', justifyContent:'center'}}>
            <div className="lanyard-badges">
              <div className="react-badge" onClick={()=> window.open('https://reactbits.dev/components/lanyard','_blank')} style={{cursor:'pointer'}}>React Bits</div>
            </div>
          </div>
          <small style={{color:'var(--muted)', fontSize:11}}>Drag & drop — like React Bits</small>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('lanyard-root')).render(<Lanyard />);
</script>

</body>
</html>
