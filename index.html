<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buying & Fairs — Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{
      --bg:#F2EEE6;          /* Beige Grund */
      --ink:#0E3B2E;         /* Dunkelgrün (Schrift) */
      --muted:#6B7A73;       /* Gedämpftes Grün-Grau */
      --pin:#7A0019;         /* Bordeaux */
      --border:#9BA8A2;      /* Landesgrenzen */
      --hover:#D8D1C4;       /* Hover-Füllung */
      --panel:#FFFFFF;       /* Panels */
      --shadow:0 14px 36px rgba(0,0,0,0.14);
    }
    *{ box-sizing:border-box; }
    html,body { height:100%; margin:0; background:var(--bg); color:var(--ink); }
    body { font-family:"Helvetica Neue", Inter, system-ui, Arial, sans-serif; letter-spacing:0.01em; }

    #map { width:100%; height:100vh; min-height:600px; }

    /* Header */
    .map-header {
      position:absolute; top:18px; right:18px; z-index:800;
      background:rgba(255,255,255,0.92); color:var(--ink);
      padding:12px 16px; border-radius:12px; border:1px solid rgba(0,0,0,0.06);
      box-shadow:0 10px 24px rgba(14,59,46,0.08); backdrop-filter: blur(2px);
    }
    .map-header h3 { margin:0; font-size:15px; letter-spacing:0.16em; text-transform:uppercase; font-weight:700; }
    .map-header p { margin:6px 0 0; font-size:13px; color:var(--muted); letter-spacing:0.04em; }

    /* Legend links, mittig (unter Zoom) */
    .legend {
      position:absolute; left:18px; top:50%; transform:translateY(-50%);
      width:310px; max-width:35vw; z-index:850;
      background:var(--panel); border:1px solid rgba(0,0,0,0.06); border-radius:14px;
      box-shadow:var(--shadow); padding:14px 16px;
    }
    .legend h4{ margin:0 0 8px; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; font-weight:800; }
    .legend .meta { font-size:12.5px; color:var(--muted); margin-bottom:6px; }
    .legend .group{ margin-top:12px; }
    .legend .group h5{ margin:0 0 8px; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#5e6a64; }
    .legend ul{ margin:0; padding:0; list-style:none; display:grid; gap:8px; }
    .legend li{ font-size:13px; line-height:1.35; }
    .legend a{ color:var(--pin); text-decoration:none; }
    .legend .empty{ color:#b1aba0; font-size:12px; }
    .stars { display:inline-flex; gap:2px; vertical-align:middle; margin-left:6px; }
    .stars svg{ width:12px; height:12px; }

    /* Tiles minimal (Labels separat) */
    .leaflet-tile { filter: grayscale(100%) contrast(1.04) brightness(1.06) sepia(0.08); }

    /* Popup */
    .leaflet-popup-content { max-width: 760px; color:var(--ink); margin: 8px 12px; }
    .title-line .city-label { font-weight:800; letter-spacing:0.12em; text-transform:uppercase; margin:0; font-size:15px; }
    .meta-line { display:flex; gap:14px; font-size:12.5px; color:var(--muted); margin:6px 0 10px; flex-wrap:wrap; }
    .meta-line span { white-space:nowrap; }

    /* „Tabellen“-Infoblöcke mit Icons */
    .info-row{ display:flex; gap:22px; margin:12px 0 16px; flex-wrap:wrap; }
    .info-item{ display:flex; flex-direction:column; align-items:flex-start; min-width:220px; }
    .info-item .icons{ display:flex; gap:6px; align-items:center; }
    .info-item .icons svg{ width:16px; height:16px; color:#111; }
    .info-item .label{ font-weight:800; letter-spacing:0.06em; margin-top:4px; }
    .info-item .sub{ color:var(--muted); font-size:12.5px; margin-top:2px; }

    /* Galerie groß & swipebar */
    .gallery {
      position: relative; width: 100%; max-width: 700px; height: 420px;
      border-radius: 14px; overflow: hidden; background: #000;
      box-shadow: var(--shadow);
      touch-action: pan-y;
    }
    .gallery img { width:100%; height:100%; object-fit: cover; display:block; user-select:none; -webkit-user-drag:none; }
    .nav-btn{
      position:absolute; top:50%; transform:translateY(-50%);
      width:46px; height:46px; border-radius:999px; border:1px solid rgba(255,255,255,0.4);
      background:rgba(0,0,0,0.25); color:#fff; display:flex; align-items:center; justify-content:center;
      cursor:pointer; backdrop-filter: blur(1px);
    }
    .nav-btn:hover{ background:rgba(0,0,0,0.35); }
    .nav-prev{ left:12px; } .nav-next{ right:12px; }
    .nav-btn svg{ width:18px; height:18px; }

    .desc { margin-top:12px; font-size:13.8px; color:var(--muted); line-height:1.55; }

    .collab-head{
      margin-top:12px; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
      color:#5e6a64; font-weight:800;
    }
    .logo-row{ margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; }
    .logo-row img, .logo-ph{
      width:88px; height:40px; object-fit:contain; background:#fff; border:1px solid #E3DED5; border-radius:8px; box-shadow:0 6px 14px rgba(0,0,0,0.06);
    }
    .logo-ph{ display:flex; align-items:center; justify-content:center; color:#B6B0A4; font-size:11px; letter-spacing:0.06em; }
    .more-link { display:inline-block; margin-top:12px; font-size:13px; color:var(--pin); text-decoration:none; }

    /* Panes */
    .leaflet-pane.leaflet-labels-pane { z-index: 650; pointer-events: none; }
    .leaflet-pane.country-borders { z-index: 400; }

    /* Tooltip */
    .leaflet-tooltip { background:rgba(255,255,255,0.92); border:1px solid rgba(0,0,0,0.06); color:var(--ink); border-radius:8px; box-shadow:0 8px 18px rgba(0,0,0,0.08); }

    /* Flugroute */
    .route { stroke:#111; stroke-opacity:0.45; stroke-width:2; stroke-dasharray:6 6; }
    .plane { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }

    /* Hover-Effekt Länder – kontrastreicher + „näher kommen“ */
    .hovered-country{
      fill: var(--hover) !important;
      fill-opacity: .22 !important;
      stroke: #333 !important;
      stroke-width: 1.8 !important;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.18));
      transform: scale(1.015);           /* leichtes Scale für „Näherkommen“ */
      transform-origin: center;
      transition: transform .18s ease, fill-opacity .18s ease, stroke-width .18s ease;
    }

    /* Zeitstrahl rechts */
    .timeline {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      height: 78vh; width: 120px; pointer-events: none; z-index: 820;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    }
    .timeline .line {
      position:absolute; left: 50%; transform: translateX(-50%);
      width:1px; height:100%; background: rgba(0,0,0,.08);
    }
    .timeline .year {
      font-size: 52px; letter-spacing: .06em; font-weight: 800;
      color: rgba(0,0,0,.08);
      transition: color .25s ease, transform .25s ease;
      user-select:none;
    }
    .timeline .year.active {
      color: rgba(0,0,0,.20);
      transform: scale(1.06);
    }

    @media (max-width:1100px){
      .legend{ display:none; } /* Mobile: Legende ausblenden */
      .timeline{ display:none; }
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="map-header">
  <h3>Buying & Fairs — European Journeys</h3>
  <p>Drag to move. Scroll to zoom. Click pins to view the gallery.</p>
</div>

<!-- Legend links, mittig -->
<aside class="legend" id="legend">
  <h4>City Guide</h4>
  <div class="meta" id="legend-meta">Wähle einen Messestandort.</div>
  <div class="group"><h5>Restaurants</h5><ul id="legend-food"><li class="empty">Noch keine Einträge</li></ul></div>
  <div class="group"><h5>Hotels</h5><ul id="legend-hotels"><li class="empty">Noch keine Einträge</li></ul></div>
  <div class="group"><h5>Spots & Experiences</h5><ul id="legend-spots"><li class="empty">Noch keine Einträge</li></ul></div>
</aside>

<!-- Zeitstrahl rechts -->
<div class="timeline" id="timeline">
  <div class="line"></div>
  <div class="year" data-y="2018">2018</div>
  <div class="year" data-y="2019">2019</div>
  <div class="year" data-y="2020">2020</div>
  <div class="year" data-y="2021">2021</div>
  <div class="year" data-y="2022">2022</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const safe = (u)=>encodeURI(u);
  const css  = (v)=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  /* ---------- Karte ---------- */
  const map = L.map('map', {
    center: [50.0, 10.0],
    zoom: 4,
    minZoom: 3,
    maxZoom: 12,
    dragging: true,
    scrollWheelZoom: true,
    tap: true
  });

  // Basemap ohne Labels
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);

  // Labels-Overlay (Länder/Städte)
  map.createPane('labels');
  map.getPane('labels').classList.add('leaflet-labels-pane');
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    pane: 'labels'
  }).addTo(map);

  // Länder-Grenzen & Hover (mit "Näherkommen"-Effekt)
  map.createPane('country-borders');
  map.getPane('country-borders').classList.add('country-borders');
  fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
    .then(r => r.json())
    .then(geo => {
      const baseStyle = { color:css('--border'), weight:0.9, opacity:0.9, fillColor:'#000', fillOpacity:0.02, className:'country' };
      const layer = L.geoJSON(geo, {
        pane:'country-borders',
        style: ()=> baseStyle,
        onEachFeature: (feature, lyr) => {
          const b = lyr.getBounds();
          // Europa-Grobfilter
          if (b && (b.getSouth()>35 && b.getNorth()<72 && b.getWest()<35 && b.getEast()>-25)) {
            lyr.on('mouseover', () => {
              const p = lyr.getElement();
              if(p){ p.classList.add('hovered-country'); }
              lyr.bringToFront();
            });
            lyr.on('mouseout', () => {
              const p = lyr.getElement();
              if(p){ p.classList.remove('hovered-country'); }
            });
          } else lyr.options.interactive = false;
        }
      }).addTo(map);
    });

  /* ---------- Icons ---------- */
  function pinSVG(size=22, color=css('--pin')){
    return `
      <svg width="${size}" height="${size*1.25}" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.25"/></filter></defs>
        <path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 6.5 12.75 7.63 14.0a0.5 0.5 0 0 0 .74 0C13.5 20.75 20 13.25 20 8c0-4.42-3.58-8-8-8z" fill="${color}" filter="url(#shadow)"/>
        <circle cx="12" cy="8" r="3.2" fill="#fff" opacity="0.9"/>
      </svg>`;
  }
  function createPinIcon(){ return L.divIcon({ className:'pin', html: pinSVG(22), iconSize:[22,28], iconAnchor:[11,24], popupAnchor:[0,-22] }); }
  const planeIcon = L.divIcon({ className:'plane', html:`<svg width="16" height="16" viewBox="0 0 24 24" fill="#000"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9L2 14v2l8-2.5V19l-2 1.5V22l3.5-1L15 22v-1.5L13 19v-5.5l8 2.5z"/></svg>`, iconSize:[16,16], iconAnchor:[8,8] });

  function iconLocation(){ return `<svg viewBox="0 0 24 24" width="16" height="16"><path fill="#111" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5z"/></svg>`; }
  function iconAirport(){ return `<svg viewBox="0 0 24 24" width="16" height="16"><path fill="#111" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9L2 14v2l8-2.5V19l-2 1.5V22l3.5-1L15 22v-1.5L13 19v-5.5l8 2.5z"/></svg>`; }
  function stars(n=4.5){
    const full=Math.floor(n), half=(n-full)>=0.5?1:0, empty=5-full-half;
    const star = (fill)=>`<svg viewBox="0 0 24 24"><path fill="${fill?'#111':'#c9c4ba'}" d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
    const halfStar = half?`<svg viewBox="0 0 24 24"><defs><linearGradient id="half"><stop offset="50%" stop-color="#111"/><stop offset="50%" stop-color="#c9c4ba"/></linearGradient></defs><path fill="url(#half)" d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`:'';
    return `<span class="stars">${Array(full).fill(0).map(()=>star(true)).join('')}${halfStar}${Array(empty).fill(0).map(()=>star(false)).join('')}</span>`;
  }

  /* ---------- Popup-HTML ---------- */
  function popupHTML(pt){
    const title = `<div class="title-line"><h3 class="city-label">${pt.title}</h3></div>`;
    const meta  = `<div class="meta-line"><span>${pt.city}, ${pt.country}</span><span>${pt.date||''}</span></div>`;
    const infoRow = `
      <div class="info-row">
        <div class="info-item">
          <div class="icons">${iconLocation()}</div>
          <div class="label">Location</div>
          <div class="sub">${pt.address || '—'}</div>
        </div>
        <div class="info-item">
          <div class="icons">${iconAirport()}</div>
          <div class="label">Nearest Airport</div>
          <div class="sub">${pt.airport || '—'}</div>
        </div>
      </div>`;
    const first = (pt.photos && pt.photos.length) ? safe(pt.photos[0]) : 'https://picsum.photos/1400/900?grayscale';
    const logos = (pt.logos && pt.logos.length)
      ? pt.logos.map(l => `<img src="${safe(l)}" alt="logo" />`).join('')
      : `<div class="logo-ph">LOGO</div><div class="logo-ph">LOGO</div><div class="logo-ph">LOGO</div>`;

    return `
      ${title}
      ${meta}
      <div class="gallery" data-id="${pt.id}">
        <img src="${first}" alt="${pt.city}" />
        <button class="nav-btn nav-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
        <button class="nav-btn nav-next" aria-label="Next"><svg viewBox="0 0 24 24"><path fill="currentColor" d="m8.59 16.59 1.41 1.41L16 12l-5.99-6-1.42 1.41L13.17 12z"/></svg></button>
      </div>
      <div class="desc">${pt.description || ''}</div>
      ${infoRow}
      <div class="collab-head">Collaborations / Buying Companies</div>
      <div class="logo-row">${logos}</div>
      <a class="more-link" href="/work/buying-and-fairs/${pt.id}">Mehr zum Besuch</a>
    `;
  }

  /* ---------- Galerie-Logic ---------- */
  const galleryIndex = new Map(); // id -> index
  function bindGalleryHandlers(container, photos, id){
    const img = container.querySelector('.gallery img');
    const prev = container.querySelector('.nav-prev');
    const next = container.querySelector('.nav-next');
    const arr = (photos || []).map(safe);
    if(!galleryIndex.has(id)) galleryIndex.set(id, 0);

    function render(){ if(arr.length){ img.src = arr[ galleryIndex.get(id) % arr.length ]; } }
    function go(d){ if(!arr.length) return; galleryIndex.set(id, (galleryIndex.get(id)+d+arr.length)%arr.length); render(); }

    prev.addEventListener('click', e => { e.stopPropagation(); go(-1); });
    next.addEventListener('click', e => { e.stopPropagation(); go(1); });

    let startX=null;
    container.querySelector('.gallery').addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; }, {passive:true});
    container.querySelector('.gallery').addEventListener('touchend',   e=>{
      if(startX===null) return;
      const dx=e.changedTouches[0].clientX-startX; if(Math.abs(dx)>40) go(dx<0?1:-1); startX=null;
    });

    render();
  }

  /* ---------- Legend & Ratings ---------- */
  function stars(n=4.5){
    const full=Math.floor(n), half=(n-full)>=0.5?1:0, empty=5-full-half;
    const star = (fill)=>`<svg viewBox="0 0 24 24"><path fill="${fill?'#111':'#c9c4ba'}" d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
    const halfStar = half?`<svg viewBox="0 0 24 24"><defs><linearGradient id="half"><stop offset="50%" stop-color="#111"/><stop offset="50%" stop-color="#c9c4ba"/></linearGradient></defs><path fill="url(#half)" d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`:'';
    return `<span class="stars">${Array(full).fill(0).map(()=>star(true)).join('')}${halfStar}${Array(empty).fill(0).map(()=>star(false)).join('')}</span>`;
  }
  function updateLegend(pt){
    const meta = document.getElementById('legend-meta');
    const food = document.getElementById('legend-food');
    const hotels = document.getElementById('legend-hotels');
    const spots = document.getElementById('legend-spots');
    meta.textContent = `${pt.city}, ${pt.country} — ${pt.title} (${pt.date||''})`;

    function fill(listEl, arr){
      listEl.innerHTML = '';
      if(!arr || !arr.length){ listEl.innerHTML = '<li class="empty">Noch keine Einträge</li>'; return; }
      arr.forEach(x => {
        const li = document.createElement('li');
        const rating = x.rating ? stars(x.rating) : '';
        li.innerHTML = x.link
          ? `<a href="${x.link}" target="_blank" rel="noopener">${x.name}</a> — ${x.note||''} ${rating}`
          : `<strong>${x.name}</strong> — ${x.note||''} ${rating}`;
        listEl.appendChild(li);
      });
    }
    fill(food, pt.guide?.food);
    fill(hotels, pt.guide?.hotels);
    fill(spots, pt.guide?.spots);
  }

  /* ---------- Zeitstrahl: aktives Jahr hervorheben ---------- */
  function highlightYear(yearStr){
    const years = document.querySelectorAll('.timeline .year');
    years.forEach(y => y.classList.toggle('active', y.dataset.y === yearStr));
  }

  /* ---------- Flugrouten: chronologisch nach Klicks ---------- */
  const HAMBURG = [53.5511, 9.9937];
  let lastPoint = null; // erster Klick startet ab Hamburg
  const routeLayer = L.layerGroup().addTo(map);

  function drawSegment(fromLatLng, toLatLng){
    L.polyline([fromLatLng, toLatLng], { className:'route' }).addTo(routeLayer);
    const lat = fromLatLng[0] + (toLatLng[0]-fromLatLng[0]) * 0.5;
    const lng = fromLatLng[1] + (toLatLng[1]-fromLatLng[1]) * 0.5;
    L.marker([lat, lng], { icon: planeIcon, interactive:false }).addTo(routeLayer);
  }

  /* ---------- Marker & Popups ---------- */
  const markers = [];
  points.forEach(pt => {
    const marker = L.marker([pt.lat, pt.lng], { icon: createPinIcon(), custom:{pt} }).addTo(map);
    markers.push(marker);
    marker.bindTooltip(`${pt.city}`, {permanent:false, direction:'top', offset:[0,-12], opacity:0.95});
    marker.bindPopup(popupHTML(pt), { maxWidth: 800, closeOnClick: true, autoClose: true });

    marker.on('popupopen', (e) => {
      const el = e.popup.getElement();
      requestAnimationFrame(() => {
        const wrap = el.querySelector('.leaflet-popup-content');
        if (wrap) bindGalleryHandlers(wrap, pt.photos, pt.id);
      });
      updateLegend(pt);

      // Jahr vom Zeitstrahl aktiv schalten
      const year = (pt.date||'').slice(-4);
      if(year) highlightYear(year);

      // Flugroute: erster Klick ab HAM, dann jeweils letzte Station -> neue Station
      const from = lastPoint ? lastPoint : HAMBURG;
      drawSegment(from, [pt.lat, pt.lng]);
      lastPoint = [pt.lat, pt.lng];
    });

    marker.on('click', () => marker.openPopup());
  });

  // Bestmöglicher Ausschnitt
  const latlngs = points.map(p => [p.lat, p.lng]);
  if(latlngs.length){
    const bounds = L.latLngBounds(latlngs);
    map.fitBounds(bounds.pad(0.25));
  }
</script>
