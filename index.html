<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buying & Fairs — Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{
      --bg-beige:#F2EEE6;
      --ink:#0E3B2E;         /* dunkelgrün */
      --muted:#6B7A73;       /* gedämpftes grün-grau */
      --pin:#7A0019;         /* bordeauxrot */
      --accent:#C5B8A5;      /* sand/beige-akzent */
      --white:#FFFFFF;
    }
    html,body { height:100%; margin:0; font-family:Inter,system-ui,Arial; background:var(--bg-beige); color:var(--ink); }
    #map { width:100%; height:100vh; min-height:520px; }

    /* dezente, minimalistische Tiles (entsättigt + leicht warm) */
    .leaflet-tile{
      filter: grayscale(100%) contrast(1.02) brightness(1.05) sepia(0.18);
    }

    /* Popup & Header-UI */
    .leaflet-popup-content { max-width: 440px; color:var(--ink); }
    .popup-photos { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .popup-photos a{ display:inline-block; border-radius:8px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,0.12); }
    .popup-photos img { width:160px; height:110px; object-fit:cover; display:block; }
    .city-label { font-weight:700; margin-bottom:8px; letter-spacing:0.2px; }
    .map-header {
      position:absolute; top:18px; left:18px; z-index:4000;
      background:rgba(255,255,255,0.92); color:var(--ink);
      padding:12px 16px; border:1px solid var(--accent);
      border-radius:12px; box-shadow:0 10px 24px rgba(14,59,46,0.10);
      backdrop-filter: blur(2px);
    }
    .map-header h3 { margin:0; font-size:16px; letter-spacing:0.6px; }
    .map-header p { margin:6px 0 0; font-size:13px; color:var(--muted); }
    @media (max-width:700px){
      .map-header { left:12px; right:12px; padding:10px; }
      .popup-photos img { width:140px; height:96px; }
    }
  </style>
</head>
<body>

<div id="map"></div>
<div class="map-header">
  <h3>Buying & Fairs — European Journeys</h3>
  <p>Drag to move, scroll to zoom. Click pins for photos and notes.</p>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // HINWEIS: Verwende nach Möglichkeit Dateinamen ohne Leerzeichen/Umlaute.
  // Dieser Helper encodiert Bild-URLs sicher, falls doch Leerzeichen enthalten sind.
  const safe = (u) => encodeURI(u);

  // Farb- und Stil-Definition für den Pin (bordeauxrot, schlanker Nadelkopf)
  function pinSVG(size=22, color='#7A0019'){
    const s = size;
    return `
      <svg width="${s}" height="${s*1.25}" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.25"/>
          </filter>
        </defs>
        <path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 6.5 12.75 7.63 14.0a0.5 0.5 0 0 0 .74 0C13.5 20.75 20 13.25 20 8c0-4.42-3.58-8-8-8z" fill="${color}" filter="url(#shadow)"/>
        <circle cx="12" cy="8" r="3.2" fill="#fff" opacity="0.85"/>
      </svg>
    `;
  }

  // Deine Punkte — bestehende + zusätzliche aus der Liste im Screenshot
  const points = [
    // Deine bisherigen Beispiele (Fotos bitte anpassen)
    {
      id: "milan2023",
      city: "Milano",
      country: "Italy",
      lat: 45.4668, lng: 9.1905,
      title: "Milano Moda",
      year: "2023",
      photos: [safe("1_firenze_%2021.jpeg"), safe("2_firenze_ 21.jpeg")],
      description: "Trend scouting, sustainable yarns and functional fabrics."
    },
    {
      id: "paris_pv_2022",
      city: "Paris",
      country: "France",
      lat: 48.8566, lng: 2.3522,
      title: "Première Vision",
      year: "2022",
      photos: ["photos/paris1.jpg"].map(safe),
      description: "Sourcing, material research, new finishes."
    },
    {
      id: "mfs_2024",
      city: "München",
      country: "Germany",
      lat: 48.1351, lng: 11.5820,
      title: "Munich Fabric Start",
      year: "2024",
      photos: ["photos/munich1.jpg","photos/munich2.jpg"].map(safe),
      description: "Functional outerwear fabrics and coatings."
    },
    // Zusätzliche Events aus deiner Liste (Jahre beispielhaft aus der Timeline, passe gern an)
    { id:"riva_2023",  city:"Riva del Garda", country:"Italy", lat:45.886, lng:10.841, title:"Expo Riva Shoe",    year:"2023", photos:[], description:"Footwear sourcing and trends." },
    { id:"pitti_2023", city:"Florenz",        country:"Italy", lat:43.7696, lng:11.2558, title:"Pitti Uomo",       year:"2023", photos:[], description:"Menswear collections, tailoring." },
    { id:"cosmoprof_2022", city:"Bologna",    country:"Italy", lat:44.4949, lng:11.3426, title:"COSMOPROF",        year:"2022", photos:[], description:"Beauty innovations and packaging." },
    { id:"cosmopack_2022", city:"Bologna",    country:"Italy", lat:44.4949, lng:11.3426, title:"COSMOPACK",        year:"2022", photos:[], description:"Packaging, materials, processes." },
    { id:"maisonobjet_paris", city:"Paris",   country:"France",lat:48.8566, lng:2.3522,  title:"Maison&Objet",     year:"2022", photos:[], description:"Home, lifestyle & material mood." },
    { id:"micam_milan", city:"Milano",        country:"Italy", lat:45.4668, lng:9.1905,  title:"MICAM",            year:"2021", photos:[], description:"Footwear international trade fair." },
    { id:"pitti_100_2021", city:"Florenz",    country:"Italy", lat:43.7696, lng:11.2558, title:"Pitti Uomo 100",   year:"2021", photos:[], description:"Centenary edition highlights." },
    { id:"nordstil_hh", city:"Hamburg",       country:"Germany",lat:53.5511,lng:9.9937,  title:"NORDSTIL",         year:"2021", photos:[], description:"Lifestyle & retail concepts." },
    { id:"ciff_cph",    city:"Kopenhagen",    country:"Denmark",lat:55.6761,lng:12.5683, title:"CIFF",             year:"2020", photos:[], description:"Copenhagen Int. Fashion Fair." },
    { id:"supreme_dus", city:"Düsseldorf",    country:"Germany",lat:51.2277,lng:6.7735,  title:"Supreme Women&Men",year:"2020", photos:[], description:"Women & men collections." },
    { id:"tranoi_paris_2020", city:"Paris",   country:"France", lat:48.8566,lng:2.3522,  title:"TRANOÏ",           year:"2020", photos:[], description:"Curated designer showcases." },
    { id:"topdrawer_ldn", city:"London",      country:"UK",     lat:51.5072,lng:-0.1276, title:"Top Drawer",       year:"2019", photos:[], description:"Design-led retail show." },
    { id:"whosnext_paris", city:"Paris",      country:"France", lat:48.8566,lng:2.3522,  title:"Who's Next",       year:"2019", photos:[], description:"Fashion & accessories." },
    { id:"tranoi_paris_2019", city:"Paris",   country:"France", lat:48.8566,lng:2.3522,  title:"TRANOÏ",           year:"2019", photos:[], description:"Designer presentations." },
    { id:"maisonobjet_paris_2019", city:"Paris", country:"France", lat:48.8566,lng:2.3522,title:"Maison&Objet",    year:"2019", photos:[], description:"Home & object design." },
    { id:"micam_milan_2018", city:"Milano",   country:"Italy",  lat:45.4668,lng:9.1905,  title:"MICAM",            year:"2018", photos:[], description:"Footwear fair." },
    { id:"fashiontech_berlin", city:"Berlin", country:"Germany",lat:52.52,  lng:13.405,  title:"FASHIONTECH",      year:"2018", photos:[], description:"Tech x fashion." },
    { id:"seek_berlin", city:"Berlin",       country:"Germany", lat:52.52,  lng:13.405,  title:"SEEK",             year:"2018", photos:[], description:"Contemporary trade show." },
    { id:"panorama_berlin_2017", city:"Berlin", country:"Germany", lat:52.52,lng:13.405, title:"Panorama Berlin",  year:"2017", photos:[], description:"Fashion trade show." }
  ];

  // Karte initialisieren
  const map = L.map('map', {
    center: [50.0, 10.0],
    zoom: 4,
    minZoom: 3,
    maxZoom: 12,
    dragging: true,
    scrollWheelZoom: true,
    tap: true
  });

  // Schlichte OSM Tiles (wir filtern sie per CSS, siehe oben)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    noWrap: false
  }).addTo(map);

  // Custom Pin als divIcon mit SVG (bordeaux-rot)
  function createPinIcon(){
    return L.divIcon({
      className: 'pin',
      html: pinSVG(22, getComputedStyle(document.documentElement).getPropertyValue('--pin').trim() || '#7A0019'),
      iconSize: [22,28],
      iconAnchor: [11,24],
      popupAnchor: [0,-20]
    });
  }

  points.forEach(pt => {
    const marker = L.marker([pt.lat, pt.lng], { icon: createPinIcon() }).addTo(map);

    // Tooltip
    marker.bindTooltip(`${pt.city}`, {permanent:false, direction:'top', offset:[0,-12], opacity:0.95});

    // Popup (größer, Bilder klickbar)
    marker.on('click', () => {
      const photoHtml = (pt.photos || [])
        .slice(0,6) // bis zu 6 Bilder anzeigen
        .map(src => {
          const url = safe(src);
          return `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${pt.city}"/></a>`;
        })
        .join('');
      const popupContent = `
        <div>
          <div class="city-label">${pt.title}${pt.year ? ' — ' + pt.year : ''}</div>
          <div style="font-size:13.5px;color:var(--muted);">${pt.description || ''}</div>
          <div class="popup-photos">${photoHtml}</div>
          <a href="/work/buying-and-fairs/${pt.id}" style="display:inline-block;margin-top:10px;font-size:13px;color:${getComputedStyle(document.documentElement).getPropertyValue('--pin').trim()};text-decoration:none;">Mehr zum Besuch</a>
        </div>`;
      marker.bindPopup(popupContent, {maxWidth:460}).openPopup();
    });
  });

  // Bestes Viewport-Fit
  const latlngs = points.map(p => [p.lat, p.lng]);
  const bounds = L.latLngBounds(latlngs);
  map.fitBounds(bounds.pad(0.25));

  // Tastatur-Fokus
  map.on('click', () => map.getContainer().focus());
</script>
</body>
</html>
