<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buying & Fairs — Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{
      --bg:#F2EEE6;
      --ink:#0E3B2E;
      --muted:#6B7A73;
      --pin:#7A0019;
      --border:#9BA8A2;
      --hover:#D8D1C4;
      --panel:#FFFFFF;
      --shadow:0 14px 36px rgba(0,0,0,0.14);
      --star:#F5C518; /* Sterne gelb */
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; background:var(--bg); color:var(--ink); }
    body{ font-family:"Helvetica Neue", Inter, system-ui, Arial, sans-serif; letter-spacing:.01em; }
    #map{ width:100%; height:100vh; min-height:600px; }

    /* Header */
    .map-header{
      position:absolute; top:18px; right:18px; z-index:800;
      background:rgba(255,255,255,.92); color:var(--ink);
      padding:12px 16px; border-radius:12px; border:1px solid rgba(0,0,0,.06);
      box-shadow:0 10px 24px rgba(14,59,46,.08); backdrop-filter: blur(2px);
    }
    .map-header h3{ margin:0; font-size:15px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; }
    .map-header p{ margin:6px 0 0; font-size:13px; color:var(--muted); letter-spacing:.04em; }

    /* Legend links, mittig */
    .legend{
      position:absolute; left:18px; top:50%; transform:translateY(-50%);
      width:320px; max-width:36vw; z-index:850; background:var(--panel);
      border:1px solid rgba(0,0,0,.06); border-radius:14px; box-shadow:var(--shadow);
      padding:14px 16px;
    }
    .legend h4{
      margin:0 0 8px; font-size:13px; letter-spacing:.16em; text-transform:uppercase;
      font-weight:800;
    }
    .legend .meta{ font-size:12.5px; color:var(--muted); margin-bottom:8px; }
    .legend .group{ margin-top:14px; padding-top:12px; border-top:1px dashed rgba(0,0,0,.10); }
    .legend .group h5{
      margin:0 0 10px; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase;
      font-weight:800; color:#4e5954;
    }
    .legend ul{ margin:0; padding:0; list-style:none; display:grid; gap:10px; }
    .legend li{
      display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
      font-size:13.5px; line-height:1.35;
    }
    .legend li .txt{ flex:1 1 auto; min-width:0; }
    .legend a{ color:#111; text-decoration:none; }       /* Links schwarz */
    .legend a:hover{ color:var(--pin); }                 /* Hover Bordeaux */
    .legend .empty{ color:#b1aba0; font-size:12px; }
    .note{ font-size:12px; color:rgba(0,0,0,.58); font-style:italic; margin-top:2px; } /* Klammerzusatz dezenter */
    .stars{ flex:0 0 auto; display:inline-flex; gap:3px; align-items:center; min-width:90px; justify-content:flex-end; margin-top:2px; }
    .stars svg{ width:16px; height:16px; }
    .stars path{ fill:var(--star); }

    /* Tiles minimal */
    .leaflet-tile{ filter: grayscale(100%) contrast(1.04) brightness(1.06) sepia(.08); }
    .leaflet-labels-pane{ opacity:.82; } /* Wasser-/Meeres-Labels dezenter */

    /* Popup */
    .leaflet-popup-content{ max-width:780px; color:var(--ink); margin:8px 12px; }
    .title-line .city-label{ font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin:0; font-size:15px; }
    .meta-line{ display:flex; gap:14px; font-size:12.5px; color:var(--muted); margin:6px 0 10px; flex-wrap:wrap; }
    .info-row{ display:flex; gap:22px; margin:12px 0 16px; flex-wrap:wrap; }
    .info-item{ display:flex; flex-direction:column; min-width:220px; }
    .info-item .icons{ display:flex; gap:6px; align-items:center; }
    .info-item .icons svg{ width:16px; height:16px; color:#111; }
    .info-item .label{ font-weight:800; letter-spacing:.06em; margin-top:4px; }
    .info-item .sub{ color:var(--muted); font-size:12.5px; margin-top:2px; }

    /* Galerie: Parallax + Ken Burns */
    .gallery{
      position:relative; width:100%; max-width:720px; height:420px;
      border-radius:14px; overflow:hidden; background:#000; box-shadow:var(--shadow);
      perspective: 800px;
    }
    .gallery .frame{ width:100%; height:100%; transform-style: preserve-3d; transition: transform .12s ease-out; }
    .gallery img{
      width:100%; height:100%; object-fit:cover; display:block; user-select:none; -webkit-user-drag:none;
      animation: ken 14s ease-in-out infinite alternate;
    }
    @keyframes ken{ 0%{ transform: scale(1) translate3d(0,0,0); } 100%{ transform: scale(1.08) translate3d(2%, -2%, 0); } }

    .nav-btn{
      position:absolute; top:50%; transform:translateY(-50%);
      width:46px; height:46px; border-radius:999px; border:1px solid rgba(255,255,255,.4);
      background:rgba(0,0,0,.25); color:#fff; display:flex; align-items:center; justify-content:center;
      cursor:pointer; backdrop-filter: blur(1px);
    }
    .nav-btn:hover{ background:rgba(0,0,0,.35); }
    .nav-prev{ left:12px; } .nav-next{ right:12px; }
    .nav-btn svg{ width:18px; height:18px; }

    .desc{ margin-top:12px; font-size:13.8px; color:var(--muted); line-height:1.55; }
    .collab-head{ margin-top:12px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#5e6a64; font-weight:800; }
    .logo-row{ margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; }
    .logo-row img, .logo-ph{
      width:100px; height:44px; object-fit:contain; background:#fff; border:1px solid #E3DED5; border-radius:8px; box-shadow:0 6px 14px rgba(0,0,0,.06);
    }
    .logo-ph{ display:flex; align-items:center; justify-content:center; color:#B6B0A4; font-size:11px; letter-spacing:.06em; }

    /* Panes */
    .leaflet-pane.leaflet-labels-pane{ z-index:650; pointer-events:none; }
    .leaflet-pane.country-borders{ z-index:400; }
    .leaflet-tooltip{ background:rgba(255,255,255,.92); border:1px solid rgba(0,0,0,.06); color:var(--ink); border-radius:8px; box-shadow:0 8px 18px rgba(0,0,0,.08); }

    /* Routen */
    .route{ stroke:#111; stroke-opacity:.45; stroke-width:2; stroke-dasharray:6 6; }
    .plane{ filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }

    /* Länderhover — kontrastreicher & „Näherkommen“ */
    .hovered-country{
      fill:var(--hover) !important; fill-opacity:.26 !important;
      stroke:#333 !important; stroke-width:1.9 !important;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.18));
      transform: scale(1.02); transform-origin:center;
      transition: transform .18s ease, fill-opacity .18s ease, stroke-width .18s ease;
    }

    /* Zeitstrahl rechts — dünn */
    .timeline{
      position:absolute; right:18px; top:50%; transform:translateY(-50%);
      height:78vh; width:120px; pointer-events:none; z-index:820;
      display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    }
    .timeline .line{ position:absolute; left:50%; transform:translateX(-50%); width:1px; height:100%; background:rgba(0,0,0,.08); }
    .timeline .year{
      font-size:52px; letter-spacing:.05em; font-weight:300;
      color:rgba(0,0,0,.08); transition: color .25s ease, transform .25s ease;
      user-select:none;
    }
    .timeline .year.active{ color:rgba(0,0,0,.20); transform:scale(1.06); }

    @media (max-width:1100px){
      .legend,.timeline{ display:none; }
      .map-header{ right:12px; left:auto; }
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="map-header">
  <h3>Buying & Fairs — European Journeys</h3>
  <p>Drag to move. Scroll to zoom. Click pins to view the gallery.</p>
</div>

<aside class="legend" id="legend">
  <h4>City Guide</h4>
  <div class="meta" id="legend-meta">Wähle einen Messestandort.</div>

  <div class="group"><h5>Hotels</h5><ul id="legend-hotels"><li class="empty">Noch keine Einträge</li></ul></div>
  <div class="group"><h5>Spots & Experiences</h5><ul id="legend-spots"><li class="empty">Noch keine Einträge</li></ul></div>
</aside>

  <div class="year" data-y="2018">2018</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const safe=(u)=>encodeURI(u);
  const css =(v)=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  /* Karte */
  const map=L.map('map',{ center:[50,10], zoom:4, minZoom:3, maxZoom:12, dragging:true, scrollWheelZoom:true, tap:true });

  /* Basemap + Labels (dezent) */
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{ attribution:'&copy; OpenStreetMap &copy; CARTO' }).addTo(map);
  map.createPane('labels'); map.getPane('labels').classList.add('leaflet-labels-pane');
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{ attribution:'&copy; OpenStreetMap &copy; CARTO', pane:'labels' }).addTo(map);

  /* Ländergrenzen + Hover */
  map.createPane('country-borders'); map.getPane('country-borders').classList.add('country-borders');
  fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
    .then(r=>r.json()).then(geo=>{
      const baseStyle={ color:css('--border'), weight:.9, opacity:.9, fillColor:'#000', fillOpacity:.02, className:'country' };
      L.geoJSON(geo,{
        pane:'country-borders',
        style:()=>baseStyle,
        onEachFeature:(f,lyr)=>{
          const b=lyr.getBounds();
          if(b && (b.getSouth()>35 && b.getNorth()<72 && b.getWest()<35 && b.getEast()>-25)){
            lyr.on('mouseover',()=>{ const p=lyr.getElement(); if(p){ p.classList.add('hovered-country'); } lyr.bringToFront(); });
            lyr.on('mouseout', ()=>{ const p=lyr.getElement(); if(p){ p.classList.remove('hovered-country'); } });
          } else lyr.options.interactive=false;
        }
      }).addTo(map);
    });

  /* Icons */
  function pinSVG(size=22,color=css('--pin')){
    return `<svg width="${size}" height="${size*1.25}" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg"><defs><filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.25"/></filter></defs><path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 6.5 12.75 7.63 14.0a0.5 0.5 0 0 0 .74 0C13.5 20.75 20 13.25 20 8c0-4.42-3.58-8-8-8z" fill="${color}" filter="url(#shadow)"/><circle cx="12" cy="8" r="3.2" fill="#fff" opacity="0.9"/></svg>`;
  }
  function createPinIcon(){ return L.divIcon({ className:'pin', html:pinSVG(22), iconSize:[22,28], iconAnchor:[11,24], popupAnchor:[0,-22] }); }
  const planeIcon=L.divIcon({ className:'plane', html:`<svg width="16" height="16" viewBox="0 0 24 24" fill="#000"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9L2 14v2l8-2.5V19l-2 1.5V22l3.5-1L15 22v-1.5L13 19v-5.5l8 2.5z"/></svg>`, iconSize:[16,16], iconAnchor:[8,8] });

  function iconLocation(){return `<svg viewBox="0 0 24 24" width="16" height="16"><path fill="#111" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5z"/></svg>`;}
  function iconAirport(){return `<svg viewBox="0 0 24 24" width="16" height="16"><path fill="#111" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9L2 14v2l8-2.5V19l-2 1.5V22l3.5-1L15 22v-1.5L13 19v-5.5l8 2.5z"/></svg>`;}

  /* Sterne (gelb, rechtsbündig per CSS) */
  function stars(n=4.5){
    const full=Math.floor(n), half=(n-full)>=0.5?1:0, empty=5-full-half;
    const star=()=>`<svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
    const halfStar=half?`<svg viewBox="0 0 24 24"><defs><linearGradient id="half"><stop offset="50%" stop-color="${css('--star')}"/><stop offset="50%" stop-color="#d7d2c7"/></linearGradient></defs><path fill="url(#half)" d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`:'';
    return `<span class="stars" aria-label="${n} stars">${Array(full).fill(0).map(star).join('')}${halfStar}${Array(empty).fill(0).map(star).join('')}</span>`;
  }

  /* Popup-HTML */
  function popupHTML(pt){
    const title=`<div class="title-line"><h3 class="city-label">${pt.title}</h3></div>`;
    const meta =`<div class="meta-line"><span>${pt.city}, ${pt.country}</span><span>${pt.date||''}</span></div>`;
    const info =`
      <div class="info-row">
        <div class="info-item"><div class="icons">${iconLocation()}</div><div class="label">Location</div><div class="sub">${pt.address||'—'}</div></div>
        <div class="info-item"><div class="icons">${iconAirport()}</div><div class="label">Nearest Airport</div><div class="sub">${pt.airport||'—'}</div></div>
      </div>`;
    const first=(pt.photos&&pt.photos.length)?safe(pt.photos[0]):'https://picsum.photos/seed/cover/1600/1100';
    const logos=(pt.logos&&pt.logos.length)?pt.logos.map(l=>`<img src="${safe(l)}" alt="logo"/>`).join(''):`<div class="logo-ph">LOGO</div><div class="logo-ph">LOGO</div><div class="logo-ph">LOGO</div>`;

    return `
      ${title}
      ${meta}
      <div class="gallery" data-id="${pt.id}">
        <div class="frame"><img src="${first}" alt="${pt.city}" /></div>
        <button class="nav-btn nav-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
        <button class="nav-btn nav-next" aria-label="Next"><svg viewBox="0 0 24 24"><path fill="currentColor" d="m8.59 16.59 1.41 1.41L16 12l-5.99-6-1.42 1.41L13.17 12z"/></svg></button>
      </div>
      <div class="desc">${pt.description||''}</div>
      ${info}
      <div class="collab-head">Collaborations / Buying Companies</div>
      <div class="logo-row">${logos}</div>
      <a class="more-link" href="/work/buying-and-fairs/${pt.id}">Mehr zum Besuch</a>
    `;
  }

  /* Galerie-Logic (Swipe, Parallax, KenBurns, wiederholbares Öffnen) */
  const galleryIndex=new Map();
  function bindGalleryHandlers(container, photos, id){
    const frame=container.querySelector('.gallery .frame');
    const img  =container.querySelector('.gallery img');
    const prev =container.querySelector('.nav-prev');
    const next =container.querySelector('.nav-next');
    const arr=(photos||[]).map(safe);
    if(!galleryIndex.has(id)) galleryIndex.set(id,0);

    function render(){
      if(!arr.length) return;
      const i=galleryIndex.get(id)%arr.length;
      img.src=arr[i];
      img.style.animation='none'; void img.offsetWidth; img.style.animation='ken 14s ease-in-out infinite alternate';
    }
    function go(d){
      if(!arr.length) return;
      let i=galleryIndex.get(id);
      i=(i+d+arr.length)%arr.length;
      galleryIndex.set(id,i);
      render();
    }
    prev.addEventListener('click',e=>{ e.stopPropagation(); go(-1); });
    next.addEventListener('click',e=>{ e.stopPropagation(); go(1); });

    // Parallax Tilt
    const box=container.querySelector('.gallery');
    box.addEventListener('mousemove',(e)=>{
      const r=box.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
      const rx=(.5-y)*6, ry=(x-.5)*6;
      frame.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
    });
    box.addEventListener('mouseleave',()=>{ frame.style.transform='rotateX(0) rotateY(0)'; });

    // Touch-Swipe
    let startX=null;
    box.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; }, {passive:true});
    box.addEventListener('touchend',   e=>{
      if(startX===null) return; const dx=e.changedTouches[0].clientX-startX; if(Math.abs(dx)>40) go(dx<0?1:-1); startX=null;
    });

    render();
  }

  /* Legend & Ratings */
  function ratingStars(n){ return stars(n); }
  function updateLegend(pt){
    const meta=document.getElementById('legend-meta');
    const food=document.getElementById('legend-food');
    const hotels=document.getElementById('legend-hotels');
    const spots=document.getElementById('legend-spots');

    meta.textContent=`${pt.city}, ${pt.country} — ${pt.title} (${pt.date||''})`;

    function fill(el, arr){
      el.innerHTML='';
      if(!arr||!arr.length){ el.innerHTML='<li class="empty">Noch keine Einträge</li>'; return; }
      arr.forEach(x=>{
        const li=document.createElement('li');
        li.innerHTML = `
          <div class="txt">${x.link?`<a href="${x.link}" target="_blank" rel="noopener">${x.name}</a>`:`<strong>${x.name}</strong>`}
            ${x.note?`<div class="note">${x.note}</div>`:''}
          </div>
          ${x.rating?ratingStars(x.rating):''}
        `;
        el.appendChild(li);
      });
    }
    fill(food, pt.guide?.food);
    fill(hotels, pt.guide?.hotels);
    fill(spots, pt.guide?.spots);
  }

  /* Zeitstrahl */
  function highlightYear(y){ document.querySelectorAll('.timeline .year').forEach(n=>n.classList.toggle('active', n.dataset.y===y)); }

  /* Flugrouten */
  const HAMBURG=[53.5511,9.9937];
  let lastPoint=null;
  const routeLayer=L.layerGroup().addTo(map);
  function drawSegment(from,to){
    L.polyline([from,to],{ className:'route' }).addTo(routeLayer);
    const lat=from[0]+(to[0]-from[0])*.5, lng=from[1]+(to[1]-from[1])*.5;
    L.marker([lat,lng],{ icon:planeIcon, interactive:false }).addTo(routeLayer);
  }

  /* Marker & Popups */
  const markers=[];
  points.forEach(pt=>{
    const m=L.marker([pt.lat,pt.lng],{ icon:createPinIcon(), custom:{pt} }).addTo(map);
    markers.push(m);
    m.bindTooltip(`${pt.city}`,{ permanent:false, direction:'top', offset:[0,-12], opacity:.95 });
    m.bindPopup(popupHTML(pt),{ maxWidth:820, closeOnClick:true, autoClose:true });

    m.on('popupopen', (e)=>{
      const el=e.popup.getElement();
      requestAnimationFrame(()=>{
        const wrap=el.querySelector('.leaflet-popup-content');
        if(wrap) bindGalleryHandlers(wrap, pt.photos, pt.id);
      });
      updateLegend(pt);
      const year=(pt.date||'').slice(-4); if(year) highlightYear(year);
      const from=lastPoint?lastPoint:HAMBURG; drawSegment(from,[pt.lat,pt.lng]); lastPoint=[pt.lat,pt.lng];
    });
    m.on('click',()=>m.openPopup());
  });

  /* Fit Bounds */
  const latlngs=points.map(p=>[p.lat,p.lng]);
  if(latlngs.length){ const b=L.latLngBounds(latlngs); map.fitBounds(b.pad(.25)); }
</script>
